<svg width="96" height="96" xmlns="http://www.w3.org/2000/svg" viewBox="-6 -9 27 27">
<defs>
<style>
.cie-body { transform-origin: 7.5px 15px; animation: cie-bob 1.8s infinite ease-in-out; }
.cie-eyes { transform-origin: 7.5px 9px; animation: cie-blink 3.4s infinite; }
.cie-flask { transform-origin: 14px 10px; animation: cie-shake 0.45s infinite alternate ease-in-out; }
.cie-b1 { animation: cie-rise 1.6s infinite ease-out; }
.cie-b2 { animation: cie-rise 1.6s infinite ease-out 0.55s; }
.cie-b3 { animation: cie-rise 1.6s infinite ease-out 1.1s; }
@keyframes cie-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-0.4px); } }
@keyframes cie-blink { 0%, 46%, 54%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.1); } }
@keyframes cie-shake { 0% { transform: rotate(-4deg); } 100% { transform: rotate(4deg); } }
@keyframes cie-rise { 0% { opacity: 0.9; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-4px); } }
</style>
</defs>
<rect x="3" y="15" width="9" height="1" fill="#000" opacity="0.5"/>
<g class="cie-body">
<g fill="#DE886D">
<rect x="3" y="13" width="1" height="2"/><rect x="5" y="13" width="1" height="2"/>
<rect x="9" y="13" width="1" height="2"/><rect x="11" y="13" width="1" height="2"/>
<rect x="2" y="6" width="11" height="7"/>
<rect x="0" y="9" width="2" height="2"/>
</g>
<g fill="#FFFFFF">
<rect x="2" y="11" width="11" height="2"/>
</g>
<rect x="7" y="11" width="1" height="2" fill="#B4B2A9"/>
<g fill="#B5D4F4">
<rect x="3" y="7" width="3" height="4"/><rect x="9" y="7" width="3" height="4"/>
</g>
<g fill="#444441">
<rect x="2" y="8" width="1" height="1"/><rect x="6" y="8" width="3" height="1"/><rect x="12" y="8" width="1" height="1"/>
</g>
<g class="cie-eyes" fill="#000">
<rect x="4" y="8" width="1" height="2"/><rect x="10" y="8" width="1" height="2"/>
</g>
<g class="cie-flask">
<rect x="13" y="9" width="2" height="2" fill="#DE886D"/>
<rect x="15" y="5" width="2" height="3" fill="#E6F1FB"/>
<rect x="14" y="8" width="4" height="1" fill="#E6F1FB"/>
<rect x="14" y="9" width="4" height="1" fill="#5DCAA5"/>
<rect x="13" y="10" width="6" height="2" fill="#1D9E75"/>
<g fill="#9FE1CB">
<rect class="cie-b1" x="15" y="3" width="1" height="1"/>
<rect class="cie-b2" x="16" y="2" width="1" height="1"/>
<rect class="cie-b3" x="15" y="1" width="1" height="1"/>
</g>
</g>
</g>
</svg>
