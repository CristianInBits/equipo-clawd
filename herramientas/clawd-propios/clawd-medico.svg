<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      .med-body { transform-origin: 7.5px 15px; animation: med-bob 1.6s infinite ease-in-out; }
      .med-eyes { transform-origin: 7.5px 9px; animation: med-blink 3.2s infinite; }
      .med-shine { animation: med-shine 1.6s infinite; }
      .med-cross { transform-origin: 18px 3.5px; animation: med-beat 0.9s infinite; }
      .med-shadow { animation: med-s 1.6s infinite; }
      @keyframes med-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-0.4px); } }
      @keyframes med-blink { 0%, 46%, 54%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.1); } }
      @keyframes med-shine { 0%, 100% { opacity: 0.95; } 50% { opacity: 0.4; } }
      @keyframes med-beat { 0%, 100% { transform: scale(1); } 25% { transform: scale(1.3); } 50% { transform: scale(1); } }
      @keyframes med-s { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.35; } }
    </style>
  </defs>
  <rect class="med-shadow" x="3" y="15" width="9" height="1" fill="#000" opacity="0.5"/>
  <g class="med-cross" fill="#E24B4A">
    <rect x="17" y="2" width="2" height="3"/>
    <rect x="16" y="3" width="4" height="1"/>
  </g>
  <g class="med-body">
    <g fill="#DE886D">
      <rect x="3" y="13" width="1" height="2"/><rect x="5" y="13" width="1" height="2"/>
      <rect x="9" y="13" width="1" height="2"/><rect x="11" y="13" width="1" height="2"/>
      <rect x="2" y="6" width="11" height="7"/>
    </g>
    <g fill="#FFFFFF">
      <rect x="2" y="11" width="11" height="2"/>
      <rect x="0" y="9" width="2" height="2"/>
      <rect x="13" y="9" width="2" height="2"/>
    </g>
    <rect x="7" y="11" width="1" height="2" fill="#B4B2A9"/>
    <g fill="#444441">
      <rect x="5" y="10" width="1" height="1"/><rect x="9" y="10" width="1" height="1"/>
      <rect x="6" y="11" width="1" height="1"/><rect x="8" y="11" width="1" height="1"/>
    </g>
    <rect x="7" y="12" width="1" height="1" fill="#888780"/>
    <rect x="2" y="6" width="11" height="1" fill="#5F5E5A"/>
    <rect x="6" y="3" width="3" height="3" fill="#D3D1C7"/>
    <rect class="med-shine" x="7" y="4" width="1" height="1" fill="#FFFFFF"/>
    <g class="med-eyes" fill="#000">
      <rect x="4" y="8" width="1" height="2"/><rect x="10" y="8" width="1" height="2"/>
    </g>
  </g>
</svg>
